name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Please don't paste passwords, vault entries or session cookies here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run `agent-box up`...
        2. Attach with playwright-cli and...
        3. See error...
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Container tool
      description: Which container tool runs the box? (`agent-box runtime` prints it)
      options:
        - Apple container
        - Docker Desktop
        - OrbStack
        - Colima
        - Docker Engine (Linux)
        - Podman
        - Other
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: Which agent was using the box, if any?
      options:
        - Claude Code
        - Codex
        - T3 Code
        - None (using it by hand)
        - Custom/Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of agent-box are you running? (`agent-box version`)
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (x64)
        - Linux (arm64)
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste the output of `agent-box status` and the end of `agent-box logs`.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here. A screenshot from `agent-box shot` helps.
