version: 2
updates:
  # Keep the GitHub Actions used by CI and CodeQL up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "automated"
    open-pull-requests-limit: 5
